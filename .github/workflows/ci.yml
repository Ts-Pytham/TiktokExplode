name: CI

on:
  push:
    branches: ["master"]
    tags: ["v*"]

  pull_request:
    branches: ["master"]

jobs:
  build-and-test:
    name: Build & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Restore dependencies
        run: dotnet restore TiktokExplode.NET.slnx

      - name: Build
        run: dotnet build TiktokExplode.NET.slnx --no-restore --configuration Release

      - name: Run Unit Tests
        run: dotnet test TiktokExplode.Tests/TiktokExplode.Tests.csproj --no-build --configuration Release --logger "console;verbosity=normal"

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Restore dependencies
        run: dotnet restore TiktokExplode.NET.slnx

      - name: Build
        run: dotnet build TiktokExplode.NET.slnx --no-restore --configuration Release

      - name: Install Playwright Browsers
        run: pwsh TiktokExplode.IntegrationTests/bin/Release/net9.0/playwright.ps1 install

      - name: Run Integration Tests
        run: dotnet test TiktokExplode.IntegrationTests/TiktokExplode.IntegrationTests.csproj --no-build --configuration Release --logger "console;verbosity=normal"

  publish:
    name: Publish to NuGet
    runs-on: ubuntu-latest
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Restore dependencies
        run: dotnet restore TiktokExplode.NET.slnx

      - name: Pack
        run: dotnet pack TiktokExplode.NET.slnx --no-restore --configuration Release

      - name: Push to NuGet
        run: dotnet nuget push "**/*.nupkg" --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
